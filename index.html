<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пошук цін</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui; }
    body {
      background: #f0f4fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: white;
      border-radius: 30px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 2rem;
      color: #0a1a2f;
      margin-bottom: 10px;
    }
    h1 span { color: #2b7aff; }
    .subtitle {
      color: #4a6a8a;
      margin-bottom: 30px;
    }
    .search-box {
      display: flex;
      gap: 12px;
      margin: 20px 0;
    }
    .search-box input {
      flex: 1;
      padding: 16px 22px;
      border: 2px solid #dde3ed;
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: #2b7aff;
    }
    .search-box button {
      padding: 16px 40px;
      background: #2b7aff;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .search-box button:hover {
      background: #1a5fd9;
    }
    .result-item {
      background: #f8faff;
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 12px;
      border: 1px solid #e9eef5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-item.lowest {
      background: #e6f5e9;
      border-left: 5px solid #0fb85a;
    }
    .store { font-weight: 600; color: #1a2b44; }
    .price { font-size: 1.3rem; font-weight: 700; color: #0a1a2f; }
    .price small { font-weight: 400; font-size: 0.8rem; color: #4a6a8a; }
    .badge {
      background: #0fb85a;
      color: white;
      padding: 3px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .loading { text-align: center; padding: 40px; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e3ebf6;
      border-top: 4px solid #2b7aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .no-results { text-align: center; padding: 40px; color: #4a6a8a; }
    .filters {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .filters select {
      padding: 10px 20px;
      border-radius: 30px;
      border: 1.5px solid #d5dfed;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Пошук <span>найнижчої</span> ціни</h1>
    <p class="subtitle">🤖 ШІ-аналіз цін з різних магазинів</p>
    
    <div class="filters">
      <select id="country">
        <option value="ua">🇺🇦 Україна</option>
        <option value="all">🌍 Всі країни</option>
      </select>
      <select id="condition">
        <option value="new">📦 Нове</option>
        <option value="used">🔄 Вживане</option>
      </select>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="iPhone 15, ноутбук..." value="iPhone 15">
      <button id="searchBtn">🔎 Шукати</button>
    </div>
    
    <div id="results"></div>
  </div>

  <script>
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const resultsDiv = document.getElementById('results');

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    async function performSearch() {
      const query = searchInput.value.trim();
      if (!query) return;
      
      resultsDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>🔍 Пошук цін...</p>
        </div>
      `;
      
      try {
        const response = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: query,
            country: document.getElementById('country').value,
            condition: document.getElementById('condition').value
          })
        });
        
        const data = await response.json();
        
        if (data.offers && data.offers.length > 0) {
          let html = `<div style="margin-bottom:15px;">✅ Знайдено ${data.total} пропозицій</div>`;
          
          data.offers.forEach((offer, index) => {
            const isLowest = index === 0;
            html += `
              <div class="result-item ${isLowest ? 'lowest' : ''}">
                <div>
                  <div class="store">${offer.store}</div>
                  <div style="color:#4a6a8a; font-size:0.9rem; margin-top:4px;">${offer.title}</div>
                  ${isLowest ? '<span class="badge">🏆 НАЙНИЖЧА</span>' : ''}
                </div>
                <div class="price">${offer.price} <small>₴</small></div>
              </div>
            `;
          });
          
          resultsDiv.innerHTML = html;
        } else {
          resultsDiv.innerHTML = `
            <div class="no-results">
              <p>😕 Нічого не знайдено. Спробуйте інший запит.</p>
            </div>
          `;
        }
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="no-results">
            <p>❌ Помилка: ${error.message}</p>
          </div>
        `;
      }
    }

    // Автоматичний пошук
    window.addEventListener('load', performSearch);
  </script>
</body>
</html>
